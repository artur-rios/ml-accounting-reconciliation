[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconciliacao"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.4",
    "openpyxl>=3.1",
    "lxml>=4.9",
    "faker>=20.0",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "matplotlib>=3.9",
    "seaborn>=0.12",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "jupyter>=1.0", "ipykernel>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (may be slow)",
]

[tool.ruff.lint]
# ruff's long-standing default rules, pyflakes (F) and pycodestyle's errors (E4, E7, E9), named so that a newer ruff
# with a wider default set does not change what ci/lint.sh checks.
select = ["E4", "E7", "E9", "F"]
