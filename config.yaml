simulation:
  n_records: 7500
  conciliation_rate: 0.70
  random_seed: 42

scenarios:
  exact:
    date_tolerance_days: 0
    value_tolerance_pct: 0.0
    n_classes: 2
  fuzzy:
    date_tolerance_days: 5
    value_tolerance_pct: 2.0
    n_classes: 3

models:
  random_forest:
    n_estimators: 200
    class_weight: balanced_subsample
  svm:
    kernel: rbf
    class_weight: balanced
  logistic_regression:
    l1_ratio: 0
    class_weight: balanced
  cv_folds: 5
  scoring: f1_macro
  test_size: 0.20

comparison:
  n_seeds: 10
  n_records: 7500
  match_rate: 0.70              # fração de pagamentos com par verdadeiro
  payments_per_supplier: 5      # pagamentos por fornecedor; define o tamanho do pool de CNPJs
  hard_negative_rate: 0.30      # fração DOS NÃO-PARES que são hard negatives (não do total)
  atypical_term_rate: 0.10      # fração dos pares verdadeiros que fogem do prazo do fornecedor
  term_shift_range: [-30, 60]          # deslocamento de prazo, em dias, para prazos atípicos
  atypical_description_rate: 0.12      # fração dos pares verdadeiros com memo não relacionado
  same_municipality_rate: 0.85  # fração dos pares verdadeiros com centro de custo no município da nota
  payment_terms_days: [0, 15, 30, 45, 60]
  csrf_threshold_brl: 5000.0
  invoice_value_range_brl: [500.0, 50000.0]
  iss_rate_range_pct: [2.0, 5.0]
  retention_rates:              # em pontos percentuais do valor dos serviços
    irrf: 1.50
    csrf: 4.65
    inss: 11.00
  retention_tolerance_pp: 0.05  # tolerância em PONTOS PERCENTUAIS para compat_* e p/ definir hard
  split: { train: 0.60, val: 0.20, test: 0.20 }
  min_precision: 0.90
  cv_folds: 5
  scoring: average_precision_excecao
  leak_guard_max_stump_accuracy: 0.95
